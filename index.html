<script>
(function(){
var WS_URL='ws://'+window.location.hostname+':5006';
var HB_MS=50;
var lastArduinoTs=0;
function setArduinoBadge(ok){
  var el=document.getElementById('conn-arduino');
  if(el)el.className='conn-item '+(ok?'online':'offline');
}
setInterval(function(){
  setArduinoBadge(lastArduinoTs>0&&Date.now()-lastArduinoTs<5000);
},1000);

// Guvenlik switchi KALDIRILDI - koruma artik surekli aktif: sayfa Jetson'a
// her baglandiginda (veya yeniden baglandiginda) otomatik ARM+HB gonderilir.
// Kullanicinin herhangi bir sey acmasina gerek yok; PC<->Jetson baglantisi
// (WS) kesilirse HB de otomatik durur ve Jetson/Arduino watchdog'lari devreye girer.
var wSrc='var ws=null,hb=null,U=null;function cw(){try{ws=new WebSocket(U);ws.onopen=function(){sh();postMessage({t:"o"})};ws.onmessage=function(e){postMessage({t:"m",d:e.data})};ws.onclose=ws.onerror=function(){ws=null;clearInterval(hb);postMessage({t:"c"});setTimeout(cw,1000)}}catch(e){setTimeout(cw,1000)}}function s(m){if(ws&&ws.readyState===1)ws.send(m)}function sh(){s("ARM");clearInterval(hb);hb=setInterval(function(){s("HB")},'+HB_MS+')}onmessage=function(e){var m=e.data;if(m.c==="i"){U=m.u;cw()}}';
var worker=null;
try{
  worker=new Worker(URL.createObjectURL(new Blob([wSrc],{type:'application/javascript'})));
  worker.onmessage=function(e){
    var m=e.data;
    if(m.t==='m'){try{var msg=JSON.parse(m.d);if(msg.type==='safety'&&msg.data){syncE()}}catch(x){}}
  };
  worker.postMessage({c:'i',u:WS_URL});
}catch(e){}

var suppressUntil=0,synClick=false;
function watchClicks(){var b=document.getElementById('emergency-stop-btn');if(!b||b.dataset.mw)return;b.dataset.mw='1';b.addEventListener('click',function(){if(synClick)return;suppressUntil=Date.now()+6000},true)}
function syncE(){var f=function(){var b=document.getElementById('emergency-stop-btn');if(!b)return false;watchClicks();if(Date.now()<suppressUntil)return true;if(!b.classList.contains('system-power-active')){synClick=true;b.click();synClick=false}return true};if(!f()){var iv=setInterval(function(){if(f())clearInterval(iv)},200);setTimeout(function(){clearInterval(iv)},5000)}}

function inject(){
  var bar=document.querySelector('.conn-bar');if(!bar)return false;if(document.getElementById('tab-bar'))return true;
  watchClicks();
  var tb=document.createElement('div');tb.className='tab-bar';tb.id='tab-bar';
  tb.innerHTML='<button class="tab-btn" id="tab-bms">BMS Hucreler</button><button class="tab-btn tab-vfd" id="tab-vfd">VFD Kontrol</button>';
  bar.appendChild(tb);
  document.getElementById('tab-bms').onclick=function(){document.getElementById('bms-panel').classList.add('visible')};
  document.getElementById('tab-vfd').onclick=function(){document.getElementById('vfd-panel').classList.add('visible');vfdReadAll()};
  document.getElementById('bms-close').onclick=function(){document.getElementById('bms-panel').classList.remove('visible')};
  document.getElementById('vfd-close').onclick=function(){document.getElementById('vfd-panel').classList.remove('visible')};
  return true;
}
if(!inject()){var iv1=setInterval(function(){if(inject())clearInterval(iv1)},100)}

// Kamerayi MJPEG stream ile degistir
function overrideCam(){
  var viewport=document.getElementById('ipcam-viewport');
  if(!viewport)return false;
  if(viewport.dataset.overridden)return true;
  viewport.dataset.overridden='1';
  viewport.style.cssText='width:100%;overflow:hidden;border-radius:8px';
  viewport.innerHTML='<img id="stream-img" src="/api/ipcam/stream" style="width:100%;height:auto;display:block">';
  // React'in snapshot polling'ini tamamen engelle
  var ph=document.getElementById('ipcam-placeholder');
  if(ph)ph.remove();
  var oldImg=document.getElementById('ipcam-img');
  if(oldImg)oldImg.remove();
  // React _connectIpcam'i devre disi birak
  var obs=new MutationObserver(function(muts){
    muts.forEach(function(m){
      m.addedNodes.forEach(function(n){
        if(n.id==='ipcam-img'||n.id==='ipcam-placeholder'){n.remove();}
      });
    });
    var si=document.getElementById('stream-img');
    if(si&&!si.src.includes('/stream')){si.src='/api/ipcam/stream';}
  });
  obs.observe(viewport,{childList:true,subtree:true});
  return true;
}
if(!overrideCam()){var ivCam=setInterval(function(){if(overrideCam())clearInterval(ivCam)},300);setTimeout(function(){clearInterval(ivCam)},10000)}

// Motor Fren Butonu - on+arka fren + motor geri tam gaz
function addMotorBrake(){
  var motorSection=document.querySelector('.layout-column.layout-side');
  if(!motorSection)return false;
  if(document.getElementById('motor-brake-wrap'))return true;
  // Motor bolumunun altina ekle

  for(var i=0;i<panels.length;i++){var t=panels[i].querySelector('.section-title');if(t&&t.textContent.indexOf('Motor')>=0){motorGroup=panels[i];break}}
  if(!motorGroup)return false;
  var lastDir='MOTOR_DIR_FORWARD';
  var wrap=document.createElement('div');wrap.id='motor-brake-wrap';wrap.style.cssText='padding:4px 8px;';
  wrap.innerHTML='<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px"><button class="motor-brake-btn" style="font-size:9px;padding:6px 10px;flex:1" id="run-3s">3sn CALISTIR</button><button class="motor-brake-btn" style="font-size:9px;padding:6px 10px;flex:1" id="run-5s">5sn CALISTIR</button><button class="motor-brake-btn" style="font-size:9px;padding:6px 10px;flex:1" id="run-7s">7sn CALISTIR</button><button class="motor-brake-btn" style="font-size:9px;padding:6px 10px;flex:1" id="run-10s">10sn CALISTIR</button></div><button class="motor-brake-btn" id="motor-brake-btn" style="width:100%;margin-top:4px">MOTOR FREN</button>';

// React'in _sendToPi'sini intercept et - MOTOR komutlarini HTTP API'ye yonlendir
// Motor frekans limitini kaldir - React'in Math.min(60) kırpmasını engelle
function unlockFreqInput(){
  var inp=document.getElementById('motor-freq-input');
  if(!inp)return false;
  if(inp.dataset.unlocked)return true;
  inp.dataset.unlocked='1';
  inp.max=500;
  inp.setAttribute('max','500');
  // Gercek degeri sakla - React kirpamadan once
  var realFreq=null;
  inp.addEventListener('input',function(){realFreq=parseFloat(this.value)||0});
  inp.addEventListener('change',function(){realFreq=parseFloat(this.value)||0});
  // value setter'i override et - React kirptiginda geri yaz
  var desc=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
  Object.defineProperty(inp,'value',{
    get:function(){return desc.get.call(this)},
    set:function(v){
      var num=parseFloat(v)||0;
      // React 60'a kirpiyorsa ve biz daha yuksek girmissek, gercek degeri koru
      if(num<=60&&realFreq>60){desc.set.call(this,String(realFreq));return}
      realFreq=num;
      desc.set.call(this,v);
    }
  });
  return true;
}

function interceptMotorCmds(){
  var origSend=WebSocket.prototype.send;
  WebSocket.prototype.send=function(data){
    if(typeof data==='string'){
      if(data==='MOTOR_DIR_FORWARD'){mapi('/motor/forward');_lastRunDir='forward';return}
      if(data==='MOTOR_DIR_REVERSE'){mapi('/motor/reverse');_lastRunDir='reverse';return}
      if(data.startsWith('MOTOR_FREQ:')){var inp=document.getElementById('motor-freq-input');var f=inp?inp.value:data.substring(11);mapi('/motor/freq/'+f);return}
      if(data==='MOTOR_GO'){mapi('/motor/go');return}
      if(data==='MOTOR_STOP'){mapi('/motor/stop');return}
    }
    origSend.call(this,data);
  };
}

var trackLen=186;
// Pist: 6m bosluk + 76m(4m aralik) + 4m bosluk + 1.95m(5cm aralik) + 2.05m bosluk
//       + 44m(4m aralik) + 4m bosluk + 0.95m(5cm aralik) + 3.05m bosluk + 44m(4m aralik) = 186m
// Toplam: 20 + 40 + 12 + 20 + 12 = 104 serit
var STRIPE_POS=(function(){
  var s=[];
  // Bolum 1: 76m boyunca 4m aralikli (20 serit, 180-104m kalan)
  for(var i=0;i<20;i++) s.push(180-i*4);
  // 4m bosluk (104 -> 100m kalan)
  // Bolum 2: Son 100m isaretcisi, 1.95m, 5cm aralikli (40 serit)
  for(var i=0;i<40;i++) s.push(100-i*0.05);
  // 2.05m bosluk (98.05 -> 96m kalan)
  // Bolum 3: 44m boyunca 4m aralikli (12 serit, 96-52m kalan)
  for(var i=0;i<12;i++) s.push(96-i*4);
  // 4m bosluk (52 -> 48m kalan)
  // Bolum 4: Son 48m isaretcisi, 0.95m, 5cm aralikli (20 serit)
  for(var i=0;i<20;i++) s.push(48-i*0.05);
  // 3.05m bosluk (47.05 -> 44m kalan)
  // Bolum 5: 44m boyunca 4m aralikli (12 serit, 44-0m kalan)
  for(var i=0;i<12;i++) s.push(44-i*4);
  return s.map(function(k){return{kalan:Math.round(k*100)/100}});

  dws.onmessage=function(evt){try{var msg=JSON.parse(evt.data);
    if(msg.type==='bms'&&Array.isArray(msg.data)){var totalV=0;msg.data.forEach(function(p){updBms(p);if(p.k&&p.v)totalV+=p.v;if(p.t!=null){var te=document.getElementById('bat-temp-'+(p.x+1));if(te)te.textContent=Number(p.t).toFixed(0)}});var tv=document.getElementById('bat-total-current');if(tv)tv.textContent='(Toplam Volt: '+totalV.toFixed(1)+' V)';document.getElementById('bms-ts').textContent=new Date().toLocaleTimeString('tr-TR')}

    else if(msg.type==='temp'||msg.type==='arduino_status'){lastArduinoTs=Date.now();setArduinoBadge(true)}
    else if(msg.type==='status'&&msg.data){lastArduinoTs=Date.now();setArduinoBadge(true);syncUI(msg.data)}
    else if(msg.type==='imu'&&msg.data){var d=msg.data;var sv=function(id,v){var e=document.getElementById(id);if(e)e.textContent=v};
      // Toplam arac ivmesi (linear = yercekimsiz)

      sv('imu-total-acc',totalAcc.toFixed(2));
      // Eksen ivmeleri (linear)
      sv('imu-lx',lx.toFixed(2));sv('imu-ly',ly.toFixed(2));sv('imu-lz',lz.toFixed(2));
      // Egim
      sv('imu-heading',d.heading!=null?d.heading.toFixed(1):'--');
      sv('imu-roll',d.roll!=null?d.roll.toFixed(1):'--');
      sv('imu-pitch',d.pitch!=null?d.pitch.toFixed(1):'--');
      // Kompakt satirlar
      sv('imu-acc-line',d.ax.toFixed(2)+' / '+d.ay.toFixed(2)+' / '+d.az.toFixed(2));
      sv('imu-gyro-line',d.gx.toFixed(1)+' / '+d.gy.toFixed(1)+' / '+d.gz.toFixed(1));
      sv('imu-mag-line',d.mx.toFixed(1)+' / '+d.my.toFixed(1)+' / '+d.mz.toFixed(1));

      if(d.cal_sys!=null){var cs=['KOTU','DUSUK','IYI','TAM'];sv('imu-cal','S:'+cs[d.cal_sys]+' G:'+cs[d.cal_gyr]+' A:'+cs[d.cal_acc]+' M:'+cs[d.cal_mag])}
      if(d.temp!=null){sv('imu-temp',d.temp+'\u00B0C')}
      // Max takip - toplam
      if(totalAcc>_imuMax.total){_imuMax.total=totalAcc;sv('imu-max-total',totalAcc.toFixed(2))}
      // Max takip - eksen
      if(Math.abs(lx)>_imuMax.ax){_imuMax.ax=Math.abs(lx);sv('imu-max-ax',_imuMax.ax.toFixed(2))}
      if(Math.abs(ly)>_imuMax.ay){_imuMax.ay=Math.abs(ly);sv('imu-max-ay',_imuMax.ay.toFixed(2))}
      if(Math.abs(lz)>_imuMax.az){_imuMax.az=Math.abs(lz);sv('imu-max-az',_imuMax.az.toFixed(2))}
      // Hiz ve yol Jetson'da filtrelenip entegre edilir; tarayici sadece gosterir.
      if(d.speed_calibrating){
        sv('sp-speed','0.0');sv('sp-status','BNO: arac sabitken ofset kalibrasyonu');
      }else if(d.speed_kmh!=null){
        sv('sp-speed',Number(d.speed_kmh).toFixed(1));
        sv('sp-max-speed',Number(d.max_speed_kmh||0).toFixed(1));
        sv('sp-distance',Number(d.distance_m||0).toFixed(1));
        sv('sp-status','BNO '+(d.speed_axis||'X')+' ekseni \u2022 tahmini hiz');
      }
      _imuLogBuf.push({t:Date.now(),total:totalAcc,lx:lx,ly:ly,lz:lz})}
    else if(msg.type==='imu_speed_reset'){var rs=document.getElementById('sp-status');if(rs)rs.textContent='BNO: yeniden kalibre ediliyor'}
    else if(msg.type==='uart_reset'){var ur=document.getElementById('uart-reset');if(ur){ur.textContent='UART Yeniden Basliyor...';ur.disabled=true}}
    else if(msg.type==='autonomous_mode'&&msg.data){updateAutonomousUI(msg.data)}
    else if(msg.type==='vfd_data'){var vb2=document.getElementById('vfd-status-badge');if(vb2){vb2.textContent=msg.connected?'VFD: Bagli':'VFD: Yok';vb2.className='bms-badge '+(msg.connected?'bms-badge-ok':'bms-badge-off')}Object.keys(msg.data).forEach(function(c){var raw=msg.data[c],re=document.getElementById('vr-'+c),se=document.getElementById('vs-'+c);if(raw==null){if(re)re.textContent='-';if(se)se.textContent='-';return}if(re)re.textContent=raw;if(se){var sc=(VP[c]&&VP[c].s)||1;se.textContent=(raw*sc).toFixed(sc<1?2:0)}})}
    else if(msg.type==='vfd_write_result'){var el=document.getElementById('vx-'+msg.code);if(el){el.textContent=msg.ok?'Yazildi':'Hata';el.className='vfd-res '+(msg.ok?'ok':'fail');setTimeout(function(){el.textContent=''},4000)}}
  }catch(e){}};
  dws.onclose=dws.onerror=function(){var b=document.getElementById('bms-ws-badge');if(b){b.textContent='KESILDI';b.className='bms-badge bms-badge-off'}var v=document.getElementById('vfd-ws-badge');if(v){v.textContent='KESILDI';v.className='bms-badge bms-badge-off'}setTimeout(connectDws,2000)};
  }catch(e){setTimeout(connectDws,2000)}
}

function syncUI(d){
  _lastHardwareStatus=d||{};

  var arBtn=document.getElementById('abs-rear-btn');

function selectedMotorDirection(){
  var fwd=document.getElementById('motor-forward-btn');
  return fwd&&fwd.classList.contains('brake-btn-active')?'forward':'reverse';
}
function autonomStart(){
  if(!dws||dws.readyState!==1){alert('Jetson baglantisi yok');return}
  if(_lastHardwareStatus.em||_lastHardwareStatus.fb||_lastHardwareStatus.rb){
    alert('Otonom baslatilamadi: once acil stopu ve frenleri serbest birak.');
    return;
  }
  var dir=selectedMotorDirection();
  _lastRunDir=dir;
  ws('AUTONOM_START:'+dir);
}
function autonomStop(){
  ws('AUTONOM_STOP');
}
function speedModeStart(){
  if(!dws||dws.readyState!==1){alert('Jetson baglantisi yok');return}
  if(_lastHardwareStatus.em||_lastHardwareStatus.fb||_lastHardwareStatus.rb){
    alert('Hiz modu baslatilamadi: once acil stopu ve frenleri serbest birak.');
    return;
  }
  var dir=selectedMotorDirection();
  _lastRunDir=dir;
  ws('SPEED_MODE_START:'+dir);

function updateAutonomousUI(d){
  var start=document.getElementById('autonom-start');
  var status=document.getElementById('autonom-status');
  var direction=document.getElementById('autonom-direction');
  var speedStart=document.getElementById('speed-mode-start');
  var speedStatus=document.getElementById('speed-mode-status');
  var speedDirection=document.getElementById('speed-mode-direction');
  if(direction)direction.textContent='Yon: '+(d.direction==='reverse'?'GERI':'ILERI');
  if(speedDirection)speedDirection.textContent='Yon: '+(d.direction==='reverse'?'GERI':'ILERI');
  var mode1Active=!!d.active&&Number(d.mode)===1;
  var mode2Active=!!d.active&&Number(d.mode)===2;
  if(start){start.dataset.active=mode1Active?'1':'0';start.classList.toggle('active',mode1Active);start.disabled=!!d.active}
  if(speedStart){speedStart.dataset.active=mode2Active?'1':'0';speedStart.classList.toggle('active',mode2Active);speedStart.disabled=!!d.active}
  if(Number(d.mode)===2&&speedStatus){
    if(mode2Active){
      speedStatus.style.color='#b99aff';
      speedStatus.textContent=Number(d.speed_kmh||0).toFixed(1)+' km/h \u2022 '+Number(d.frequency).toFixed(1)+' Hz';
    }else{
      speedStatus.style.color=d.reason==='error'||d.reason==='imu_lost'?'#ff7272':'#8fa5b5';
      var speedReasons={imu_calibrating:'BNO kalibrasyonu bekleniyor',imu_lost:'BNO verisi kesildi \u2022 motor durdu',imu_reset:'BNO sifirlandi \u2022 motor durdu',error:'Hata \u2022 motor durdu'};
      speedStatus.textContent=speedReasons[d.reason]||'Hazir \u2022 motor durdu';
    }
    return;
  }
  if(!status)return;
  if(mode1Active){
    status.style.color='#56e6ac';
    status.textContent='Kademe '+d.stage+'/5 \u2022 '+Number(d.frequency).toFixed(0)+' Hz \u2022 kalan '+Number(d.remaining).toFixed(1)+' sn';
  }else if(Number(d.mode)===1){
    status.style.color=d.reason==='completed'?'#56e6ac':'#8fa5b5';
    status.textContent=d.reason==='completed'?'Tamamlandi \u2022 motor durdu':'Hazir \u2022 motor durdu';
  }
}

function runTimed(sec,btn){
  if(btn.dataset.active==='1')return;
  var fwdBtn=document.getElementById('motor-forward-btn');
  var isForward=fwdBtn&&fwdBtn.classList.contains('brake-btn-active');
  var dir=isForward?'forward':'reverse';
  var revDir=isForward?'reverse':'forward';
  var inp=document.getElementById('motor-freq-input');
  var freq=inp?parseFloat(inp.value)||10:10;
  _lastRunDir=dir;
  _lastRunFreq=freq;
  btn.dataset.active='1';btn.classList.add('active');
  // Motor calistir (HTTP API ile)
  mapi('/motor/'+dir);
  mapi('/motor/freq/'+freq);
  mapi('/motor/go');
  var rem=sec;btn.textContent=rem+'sn';
  var cd=setInterval(function(){
    rem--;btn.textContent=rem+'sn';
    if(rem<=0){
      clearInterval(cd);
      // Motor durdur + fren + motor fren (ters yon)
      mapi('/motor/stop');
      ws('FRONT_ON');ws('REAR_ON');
      mapi('/motor/'+revDir);
      mapi('/motor/freq/'+freq);
      mapi('/motor/go');
      btn.textContent='FREN...3sn';
      var fr=3;
      var cd2=setInterval(function(){
        fr--;btn.textContent='FREN...'+fr+'sn';
        if(fr<=0){clearInterval(cd2);mapi('/motor/stop');btn.classList.remove('active');btn.dataset.active='0';btn.textContent=sec+'sn CALISTIR';}
      },1000);
    }
  },1000);
}
function motorBrake(btn){
  if(btn.dataset.active==='1')return;
  autonomStop();
  btn.dataset.active='1';
  var revDir=_lastRunDir==='forward'?'reverse':'forward';
  btn.classList.add('active');btn.textContent='MOTOR FREN (3sn)';
  ws('FRONT_ON');ws('REAR_ON');
  mapi('/motor/'+revDir);
  mapi('/motor/freq/'+_lastRunFreq);
  mapi('/motor/go');
  var rem=3;
  var cd=setInterval(function(){
    rem--;btn.textContent='MOTOR FREN ('+rem+'sn)';
    if(rem<=0){clearInterval(cd);mapi('/motor/stop');btn.classList.remove('active');btn.textContent='MOTOR FREN';btn.dataset.active='0';}
  },1000);
}

function vfdSend(m){if(dws&&dws.readyState===1)dws.send(m)}
function vfdReadAll(){vfdSend('VFD_READ_ALL')}
function uartReset(){
  if(!dws||dws.readyState!==1){alert('Jetson baglantisi yok');return}
  if(!confirm('UART hatti yeniden baslatilacak ve motor durdurulacak. Devam edilsin mi?'))return;
  var b=document.getElementById('uart-reset');
  if(b){b.disabled=true;b.textContent='UART Yeniden Basliyor...'}
  vfdSend('UART_RESET');
  setTimeout(function(){
    if(b){b.disabled=false;b.textContent='UART Hattini Resetle'}
    vfdReadAll();
  },4500);
}
document.getElementById('vfd-read-all').onclick=vfdReadAll;
document.getElementById('uart-reset').onclick=uartReset;
document.getElementById('vfd-body').addEventListener('click',function(e){if(!e.target.classList.contains('vfd-wbtn'))return;var c=e.target.dataset.code,inp=document.getElementById('vi-'+c),val=parseInt(inp.value,10);if(isNaN(val))return;if(!confirm(c+' ('+VP[c].n+') = '+val+' yazilacak. Emin misin?'))return;vfdSend('VFD_WRITE:'+c+':'+val)});
})();
</script>
</body>
